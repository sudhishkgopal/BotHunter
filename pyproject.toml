[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Project metadata ─────────────────────────────────────────────────────────

[project]
name = "bothunter"
version = "1.0.0"
description = "Graph-based social media bot detection using K-Core Decomposition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sudhish Gopalakrishnan", email = "sudhish.gk1@gmail.com" },
]
keywords = ["bot-detection", "graph-analysis", "social-network", "k-core", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet",
]

# ─── Runtime dependencies (mirrors requirements.txt core + dashboard sections) ─

dependencies = [
    "sqlalchemy>=2.0",
    "networkx>=3.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "pyvis>=0.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

# ─── Optional dependency groups ───────────────────────────────────────────────

[project.optional-dependencies]

# Testing, linting, and type-checking
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

# AI-powered node explanations (set AI_ENABLED=true in config.json / .env)
ai = [
    "openai>=1.30",
    "google-generativeai>=0.7",
    "anthropic>=0.28",
]

# GPU-accelerated graph computation (CUDA 12 + cuGraph)
gpu = [
    "cudf-cu12>=24.4",
    "cugraph-cu12>=24.4",
]

# Production server + PostgreSQL backend (for cloud deploy)
deploy = [
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
]

# ─── CLI entry point ──────────────────────────────────────────────────────────

[project.scripts]
bothunter = "cli:app"

# ─── Setuptools: flat-layout module discovery ─────────────────────────────────
# All source modules live at the repo root (flat layout, no bothunter/ subdir).
# List every installable .py module explicitly so `pip install .` and the
# "bothunter" entry point script work correctly.

[tool.setuptools]
py-modules = [
    "app",
    "ai_insights",
    "cli",
    "database",
    "ingestor",
    "main",
    "models",
    "processor",
]

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ─── Ruff (linter + formatter) ────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing source files — suppress E501 (long lines in comments/strings)
# that would require invasive reformatting of non-logic code.
"ai_insights.py"  = ["E501"]
"ingestor.py"     = ["E501", "F841"]
"main.py"         = ["E501"]
"processor.py"    = ["E501"]
"tests/test_api.py" = ["E501"]

# ─── Mypy (static type checker) ───────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = true
