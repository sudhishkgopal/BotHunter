[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bothunter"
version = "1.0.0"
description = "Graph-based social media bot detection using K-Core Decomposition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "sqlalchemy>=2.0",
    "networkx>=3.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "pyvis>=0.3",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

ai = [
    "openai>=1.30",
    "google-generativeai>=0.7",
    "anthropic>=0.28",
]

deploy = [
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
bothunter = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
